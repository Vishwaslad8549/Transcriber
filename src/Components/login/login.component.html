<div class="login-container">
  <div class="login-card">
    <div class="logo-section">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
      </div>
      <h1>Transcriber</h1>
      <p class="subtitle">Sign in to continue</p>
    </div>

    <div class="google-btn-wrapper">
      <div #googleBtn></div>
    </div>

    @if (loading()) {
      <p class="status-message loading">Signing you in...</p>
    }
    @if (error()) {
      <p class="status-message error">{{ error() }}</p>
    }

    <div class="features">
      <div class="feature">
        <span class="icon">
          <svg viewBox="0 0 24 24">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
          </svg>
        </span>
        <span>Secure Google authentication</span>
      </div>
      <div class="feature">
        <span class="icon">
          <svg viewBox="0 0 24 24">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
          </svg>
        </span>
        <span>Transcribe MP3 & MP4 files</span>
      </div>
      <div class="feature">
        <span class="icon">
          <svg viewBox="0 0 24 24">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
          </svg>
        </span>
        <span>Powered by AI transcription</span>
      </div>
    </div>

    <div class="faq-section">
      <p class="faq-text">Have questions?</p>
      <a href="/faq" class="faq-link">
        <svg viewBox="0 0 24 24" class="faq-icon">
          <path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.5-3 5h2c0-2.5 3-3 3-5 0-2.21-1.79-4-4-4z"/>
        </svg>
        View FAQ
      </a>
    </div>
  </div>
</div>
